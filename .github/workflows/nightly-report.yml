name: Tech Sentinel Daily Intelligence & Unified Dispatch

on:
  schedule:
    - cron: '30 2 * * *' # 8:00 AM IST / 02:30 UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  daily-report-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Collect, Process, Synthesize Daily Report & Dispatch
        env:
          WORKER_API_URL: ${{ secrets.WORKER_API_URL }}
          INGESTION_SECRET: ${{ secrets.INGESTION_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.GMAIL_USER || secrets.EMAIL_USER || '' }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || secrets.GMAIL_APP_PASSWORD || secrets.EMAIL_PASSWORD || '' }}
          GMAIL_USER: ${{ secrets.GMAIL_USER || secrets.SMTP_USER || secrets.EMAIL_USER || '' }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD || secrets.SMTP_PASSWORD || secrets.EMAIL_PASSWORD || '' }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || secrets.SMTP_USER || secrets.GMAIL_USER || '' }}
          EMAIL_TO: ${{ secrets.EMAIL_TO || secrets.NEWSLETTER_EMAIL || '' }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL || 'https://tech-sentinel-chi.vercel.app' }}
          WEB_APP_URL: ${{ secrets.WEB_APP_URL || 'https://tech-sentinel-chi.vercel.app' }}
        run: |
          python -m agent.main collect
          python -m agent.main process
          python -m agent.main report
          python -m agent.main dispatch
