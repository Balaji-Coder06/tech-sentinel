name: Tech Sentinel Scheduled Telegram Digest

on:
  schedule:
    - cron: '30 14 * * *' # 8:00 PM IST / 14:30 UTC
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  dispatch-telegram-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Dispatch Personalized Telegram Digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WORKER_API_URL: ${{ secrets.WORKER_API_URL }}
          INGESTION_SECRET: ${{ secrets.INGESTION_SECRET }}
          WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
        run: |
          python -m agent.main telegram digest
