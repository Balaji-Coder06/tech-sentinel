name: Tech Sentinel Continuous Ingestion & Opportunity Scan

on:
  schedule:
    - cron: '0 */2 * * *' # Run continuously every 2 hours
  workflow_dispatch: # Allow manual trigger

jobs:
  collect-and-process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Collection, Processing & Production Sync
        env:
          WORKER_API_URL: ${{ secrets.WORKER_API_URL }}
          INGESTION_SECRET: ${{ secrets.INGESTION_SECRET }}
        run: |
          python -m agent.main collect
          python -m agent.main process
