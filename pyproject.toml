[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-sentinel"
version = "1.0.0"
description = "Personal AI-Powered Technology Intelligence & Opportunity Radar"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.3",
    "pydantic>=2.7.0",
    "dateparser>=1.2.0",
    "scikit-learn>=1.4.0",
    "python-dotenv>=1.0.1"
]

[project.scripts]
tech-sentinel = "agent.main:main"
